# TODO(폴리레포 전환 — 후속 작업):
#   - IdentityServiceApplicationTests(@SpringBootTest 컨텍스트 로드 테스트)가 CI에 아직 안
#     붙어있다. 실제 MySQL이 필요한데, 폴리레포 전환 계획서 6장 2단계(과도기)에서는
#     groovy-infra가 아직 없어 로컬/CI 통합 테스트가 원본 Groovy 레포의 docker-compose.local.yml에
#     의존하는 상태이므로, 이 서비스 레포 CI에서 테스트를 어떻게 돌릴지(서비스 컨테이너 도입 vs
#     계속 보류)는 그 정책이 정해진 뒤 채운다.
#   - event-contract(libs/event-contract): 이 서비스는 발행 예정(USER_DELETED)인데 아직 발행
#     코드 자체가 없다(회원 탈퇴 기능 미구현 — UserDeletedPayload.java 주석 참고). 그래서 계획서
#     3장의 "발행/구독 payload가 고정 스키마와 일치하는가"를 검증할 계약 테스트도 아직 없다.
#     회원 탈퇴 기능과 발행 코드를 구현하는 시점에, notification-service의 contract-test job과
#     동일한 패턴(EventEnvelope+UserDeletedPayload 고정 fixture 역직렬화 테스트)을 이 job에
#     추가해야 한다.
name: Identity Service Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # identity-service는 JWT 발급자다. study/calendar/content/notification-service가 이 서비스가
  # 내려주는 JWKS 응답을 jjwt로 직접 소비해 서명을 검증하므로, JwksControllerContractTest가
  # "실제 컨슈머 라이브러리로 진짜 소비 가능한가"를 검증한다 — event-contract 스키마 검증(3장)과
  # 같은 성격의 "발급자-소비자 간 계약이 조용히 깨지지 않게 하는" 안전장치라 동일하게 CI에 둔다.
  # 순수 단위 테스트라 별도 인프라(DB/Redis/Kafka) 없이 돈다.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run JWKS contract tests
        run: ./gradlew :services:identity-service:test --tests "*ContractTest" --no-daemon

  identity-service:
    needs: contract-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push identity-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            bebeghi/groovy-identity-service:latest
            bebeghi/groovy-identity-service:${{ github.sha }}
          cache-from: type=gha,scope=identity-service
          cache-to: type=gha,mode=max,scope=identity-service
