# Phase 06(Groovy GitOps 빌드 지시서) — main 실배포 CI. dev 전용 테스트 CI(ci-test.yml)와 달리
# main에 push될 때만 이미지를 빌드해 Docker Hub(ttt103 계정)에 push하고, groovy-infra의 배포
# 태그를 갱신한다. 이 워크플로가 CI(이미지 빌드)와 CD(ArgoCD가 groovy-infra의 main을 감시)를
# 잇는 연결고리다.
#
# TODO(폴리레포 전환 — 후속 작업):
#   - IdentityServiceApplicationTests(@SpringBootTest 컨텍스트 로드 테스트)가 CI에 아직 안
#     붙어있다. 실제 MySQL이 필요한데, groovy-infra와의 통합 테스트 인프라(서비스 컨테이너 도입
#     여부)가 아직 정해지지 않아 보류한다.
#   - event-contract(libs/event-contract): 이 서비스는 발행 예정(USER_DELETED)인데 아직 발행
#     코드 자체가 없다(회원 탈퇴 기능 미구현). 발행 코드 구현 시 계약 테스트를 추가해야 한다.
name: Identity Service Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # identity-service는 JWT 발급자다. study/calendar/content/notification-service가 이 서비스가
  # 내려주는 JWKS 응답을 jjwt로 직접 소비해 서명을 검증하므로, JwksControllerContractTest가
  # "실제 컨슈머 라이브러리로 진짜 소비 가능한가"를 검증한다 — event-contract 스키마 검증과
  # 같은 성격의 "발급자-소비자 간 계약이 조용히 깨지지 않게 하는" 안전장치라 여기서도 돈다.
  # 순수 단위 테스트라 별도 인프라(DB/Redis/Kafka) 없이 돈다.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run JWKS contract tests
        run: ./gradlew :services:identity-service:test --tests "*ContractTest" --no-daemon

  identity-service:
    needs: contract-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push identity-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # sha 태그만 쓴다(:latest 같은 가변 태그 없음) — GitOps는 groovy-infra의 values.yaml에
          # 박힌 정확한 태그로만 배포 대상을 판단하므로, 가변 태그가 있으면 오히려 혼란만 준다.
          tags: ttt103/groovy-identity-service:${{ github.sha }}
          cache-from: type=gha,scope=identity-service
          cache-to: type=gha,mode=max,scope=identity-service

      # 여기서부터 CD 연결 — groovy-infra의 main 브랜치에 있는 이 서비스의 values.yaml 이미지
      # 태그를 새로 push한 sha로 갱신해 커밋한다. ArgoCD가 groovy-infra main을 감시 중이므로,
      # 이 커밋 하나가 실제 클러스터 배포를 트리거한다. GITHUB_TOKEN은 이 레포에만 범위가 있어
      # 다른 레포에 못 쓰므로, groovy-infra 쓰기 권한이 있는 별도 PAT(INFRA_REPO_PAT)가 필요하다
      # — Docker Hub 토큰과 마찬가지로 레포 소유자가 직접 발급해서 시크릿으로 등록해야 한다.
      - name: Checkout groovy-infra
        uses: actions/checkout@v4
        with:
          repository: KDT-Team26/groovy-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: groovy-infra

      - name: Bump image tag in groovy-infra
        working-directory: groovy-infra
        run: |
          sed -i -E "s/^(    tag: ).*/\1\"${{ github.sha }}\"/" helm/identity-service/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/identity-service/values.yaml
          if git diff --cached --quiet; then
            echo "이미지 태그가 이미 최신 상태라 커밋할 변경 사항이 없습니다."
          else
            git commit -m "chore(identity-service): bump image tag to ${{ github.sha }}"
            git push
          fi
