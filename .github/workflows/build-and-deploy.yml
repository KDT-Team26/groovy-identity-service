# 실배포 워크플로우
# main에 push될 때만 이미지를 빌드해 ECR에 push하고, ArgoCD가 배포
name: Identity Service Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC로 ECR push용 IAM 역할을 assume하기 위해 필요

jobs:
  # identity-service는 JWT 발급자다. study/calendar/content/notification-service가 이 서비스가
  # 내려주는 JWKS 응답을 jjwt로 직접 소비해 서명을 검증하므로, JwksControllerContractTest가
  # "실제 컨슈머 라이브러리로 진짜 소비 가능한가"를 검증한다 — event-contract 스키마 검증과
  # 같은 성격의 "발급자-소비자 간 계약이 조용히 깨지지 않게 하는" 안전장치라 여기서도 돈다.
  # 순수 단위 테스트라 별도 인프라(DB/Redis/Kafka) 없이 돈다.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run JWKS contract tests
        run: ./gradlew :services:identity-service:test --tests "*ContractTest" --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

  identity-service:
    needs: contract-test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::665206375378:role/groovy-github-actions-ecr-role
          aws-region: ap-northeast-2

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push identity-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          secrets: |
            gpr_actor=${{ github.actor }}
            gpr_token=${{ secrets.GPR_TOKEN }}
          platforms: linux/arm64
          # sha 태그만 쓴다(:latest 같은 가변 태그 없음) — GitOps는 groovy-infra의 values.yaml에
          # 박힌 정확한 태그로만 배포 대상을 판단하므로, 가변 태그가 있으면 오히려 혼란만 준다.
          tags: ${{ steps.ecr-login.outputs.registry }}/groovy-identity-service:${{ github.sha }}
          cache-from: type=gha,scope=identity-service
          cache-to: type=gha,mode=max,scope=identity-service

      # 여기서부터 CD 연결 — groovy-infra의 main 브랜치에 있는 이 서비스의 values.yaml 이미지
      # 태그를 새로 push한 sha로 갱신해 커밋한다.
      - name: Checkout groovy-infra
        uses: actions/checkout@v4
        with:
          repository: KDT-Team26/groovy-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: groovy-infra

      - name: Bump image tag in groovy-infra
        working-directory: groovy-infra
        run: |
          sed -i -E "s/^(    tag: ).*/\1\"${{ github.sha }}\"/" helm/identity-service/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/identity-service/values.yaml
          if git diff --cached --quiet; then
            echo "이미지 태그가 이미 최신 상태라 커밋할 변경 사항이 없습니다."
          else
            git commit -m "chore(identity-service): bump image tag to ${{ github.sha }}"
            git push
          fi
